name: Test, build and deploy

# Every push to main: test → reporter jar (rebuilt + GitHub Release only when reporter/ changed) → site+API image (jar included) → deploy to the VPS.
# Pull requests only run the tests and the reporter build.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            web/package-lock.json
      - name: Backend tests
        working-directory: backend
        run: |
          npm ci
          npx tsc --noEmit
          npx vitest run
      - name: Website build
        working-directory: web
        run: |
          npm ci
          npm run build

  reporter:
    # The jar is only rebuilt and released when reporter/ changed since the last reporter-v* release;
    # otherwise the site keeps serving that release's jar. Pull requests always build it.
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changed.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Did the reporter change?
        id: changed
        shell: bash
        run: |
          last=$(git tag -l 'reporter-v*' --sort=-v:refname | head -1)
          echo "last=$last" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = pull_request ] || [ -z "$last" ] || ! git diff --quiet "$last" HEAD -- reporter/; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "reporter/ unchanged since $last; reusing its jar"
          fi
      - name: Reuse the last release's jar
        if: steps.changed.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ steps.changed.outputs.last }}" --repo "$GITHUB_REPOSITORY" --dir downloads
      - uses: actions/setup-java@v4
        if: steps.changed.outputs.changed == 'true'
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
          cache-dependency-path: reporter/*.gradle.kts
      - name: Build bingo-reporter
        if: steps.changed.outputs.changed == 'true'
        working-directory: reporter
        run: ./gradlew test build -Pmod_version=0.1.${{ github.run_number }} --no-daemon
      - name: Package download
        if: steps.changed.outputs.changed == 'true'
        shell: bash
        run: |
          mkdir -p downloads
          version=0.1.${{ github.run_number }}
          file=bingo-reporter-$version.jar
          cp reporter/build/libs/$file downloads/
          prop() { grep "^$1=" reporter/gradle.properties | cut -d= -f2; }
          cat > downloads/reporter.json <<EOF
          {
            "version": "$version",
            "file": "$file",
            "size": $(stat -c %s downloads/$file),
            "sha256": "$(sha256sum downloads/$file | cut -d' ' -f1)",
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "commit": "$GITHUB_SHA",
            "minecraft": "$(prop minecraft_version)",
            "yab": "$(prop bingo_api_version)"
          }
          EOF
          cat downloads/reporter.json
      - name: Changelog since the last release
        if: steps.changed.outputs.changed == 'true'
        shell: bash
        run: |
          mkdir -p notes
          last="${{ steps.changed.outputs.last }}"
          git log --no-merges --format='- %s (%h)' ${last:+"$last..HEAD"} -- reporter/ > notes/changes.md
          cat notes/changes.md
      - uses: actions/upload-artifact@v4
        with:
          name: downloads
          path: downloads/
      - uses: actions/upload-artifact@v4
        if: steps.changed.outputs.changed == 'true'
        with:
          name: notes
          path: notes/

  release:
    # a new GitHub Release (reporter-v0.1.<run>) only when the jar was rebuilt
    runs-on: ubuntu-latest
    needs: [test, reporter]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.reporter.outputs.changed == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: downloads
          path: downloads/
      - uses: actions/download-artifact@v4
        with:
          name: notes
          path: notes/
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          meta() { python3 -c "import json,sys; print(json.load(open('downloads/reporter.json'))[sys.argv[1]])" "$1"; }
          version=$(meta version); file=$(meta file)
          {
            echo "## Changes"
            echo
            cat notes/changes.md
            echo
            echo "## Install"
            echo
            echo "Needs Minecraft $(meta minecraft) · Fabric · Yet Another Bingo $(meta yab)+"
            echo
            echo "1. Put \`$file\` in \`.minecraft/mods\` on the computer that hosts the game (next to YAB)."
            echo "2. Start the game once; it creates \`config/bingo-reporter.json\`."
            echo "3. Create an upload key at https://bingo.dyrox.cat/account and put it in \`key\`."
            echo
            echo "sha256 \`$(meta sha256)\`"
          } > notes.md
          gh release create "reporter-v$version" "downloads/$file" downloads/reporter.json \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "bingo-reporter $version" --notes-file notes.md --latest

  build:
    runs-on: ubuntu-latest
    needs: [test, reporter]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: downloads
          path: downloads/
      - name: Resolve image name
        id: image
        shell: bash
        run: |
          echo "image_base=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.image }}
            ${{ steps.image.outputs.image_base }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      DEPLOY_PATH: /opt/bingo-platform
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        shell: bash
        run: |
          test -n "$VPS_HOST" && test -n "$VPS_USER" && test -n "$VPS_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Upload Compose file
        shell: bash
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -p $VPS_PORT $VPS_USER@$VPS_HOST"
          SCP="scp -i ~/.ssh/deploy_key -P $VPS_PORT"
          $SSH "mkdir -p '$DEPLOY_PATH'"
          $SCP deploy/compose.yml deploy/.env.example "$VPS_USER@$VPS_HOST:$DEPLOY_PATH/"
          # .env holds the database password and Discord secret; it is created by hand on the VPS
          $SSH "test -f '$DEPLOY_PATH/.env'"
      - name: Log in to GHCR from VPS
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
      - name: Deploy
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        shell: bash
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -p $VPS_PORT $VPS_USER@$VPS_HOST"
          $SSH "cd '$DEPLOY_PATH' && IMAGE='$IMAGE' docker compose -f compose.yml pull app"
          $SSH "cd '$DEPLOY_PATH' && IMAGE='$IMAGE' docker compose -f compose.yml up -d --remove-orphans"
          $SSH "docker image prune -f"
      - name: Check the site answers
        shell: bash
        run: |
          for i in $(seq 20); do
            if curl -fsS https://bingo.dyrox.cat/api/health; then exit 0; fi
            sleep 3
          done
          echo "bingo.dyrox.cat did not answer /api/health" >&2
          exit 1
