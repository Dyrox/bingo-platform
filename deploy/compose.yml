# /opt/bingo-platform/compose.yml on the VPS. CI uploads it and runs: IMAGE=<tag> docker compose up -d
services:
  app:
    image: ${IMAGE:?Set IMAGE to the image tag you want to run}
    restart: unless-stopped
    init: true
    # host network: reaches the host's Postgres on 127.0.0.1; HOST below keeps the app off the public interface.
    # nginx on the host proxies https://bingo.dyrox.cat → 127.0.0.1:3100
    network_mode: host
    env_file: .env
    environment:
      HOST: 127.0.0.1
      PORT: ${APP_PORT:-3100}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:${APP_PORT:-3100}/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
