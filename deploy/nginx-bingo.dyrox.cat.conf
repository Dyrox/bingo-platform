# /etc/nginx/sites-available/bingo.dyrox.cat (symlinked into sites-enabled). certbot --nginx adds the 443 block.
server {
    listen 80;
    listen [::]:80;
    server_name bingo.dyrox.cat;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # YAB import: bingo.db plus a folder of server logs (the app caps logs at 200 MB)
    location = /api/me/import/yab {
        client_max_body_size 250m;
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
